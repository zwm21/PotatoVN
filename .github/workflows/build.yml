name: build

# 每次推 dev / 提 PR 时只构建自包含便携包（绿色版），不再打 MSIX sideload 测试包
# 便携包把 .NET 与 Windows App SDK 运行时一起打包，目标机无需安装任何运行时，解压即用。
# 推 dev 与手动 dispatch 还会把该便携包发成 GitHub Release（tag 用动态版本号），作为分发渠道。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 目标平台（对应 GalgameManager/Properties/PublishProfiles/win10-<platform>.pubxml）
        required: true
        default: x64
        type: choice
        options:
          - x64
          - x86
          - arm64
  push:
    branches:
      - dev
    paths:
      - 'GalgameManager/**'
      - 'GalgameManager.Core/**'
      - 'GalgameManager.WinApp.Base/**'
  pull_request:
    paths:
      - 'GalgameManager/**'
      - 'GalgameManager.Core/**'
      - 'GalgameManager.WinApp.Base/**'

permissions:
  # 创建 Release 与上传资产需要写权限
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # 动态版本需要完整 git 历史：提交总数与"自 manifest 改动以来的提交数"都靠 rev-list 计算，
        # 浅克隆（默认 depth=1）下这两个值会退化为 1 / 0
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # push / pull_request 事件没有 inputs，回退到 x64
    - name: Resolve platform
      shell: pwsh
      run: |
        $platform = "${{ inputs.platform }}"
        if ([string]::IsNullOrWhiteSpace($platform)) { $platform = "x64" }
        echo "PLATFORM=$platform" >> $env:GITHUB_ENV
        echo "目标平台: $platform"

    # dev 构建换上 dev 版窗口图标。只复制 WindowIcon.ico：
    # icon-dev 里其余 30 个文件是 MSIX 磁贴/启动屏视觉资产（Potato.scale-*.png、Potato.targetsize-*.png 等），
    # 便携构建用不到；而 MSIX 命名规则下 Potato.scale-100.png 与 Potato.png 是同一资源的不同 scale
    # 限定版本，全部复制进 Assets 会让 MakePri 报 PRI175 / PRI277 Duplicate Entry。
    - name: Update app icon
      shell: cmd
      run: |
        xcopy "GalgameManager\Assets\Pictures\icon-dev\WindowIcon.ico" "GalgameManager\Assets\" /y
        echo Updated app icon

    - name: Publish portable build
      # PublishDir 必须是绝对路径：传相对路径时 MSBuild 按项目目录解析，
      # 产物会落到 GalgameManager/publish/portable 而不是仓库根目录的 publish/portable
      run: >
        dotnet publish GalgameManager/GalgameManager.csproj
        -c Release
        -p:Platform=${{ env.PLATFORM }}
        -p:PublishProfile=win10-${{ env.PLATFORM }}
        -p:PotatoVnPortable=true
        -p:PublishDir=${{ github.workspace }}/publish/portable/

    # 自包含打包的核心标志：WinAppSDK 运行时必须出现在输出目录里，
    # 否则打出来的包在没装 Windows App Runtime 的机器上起不来
    - name: Verify bundled runtime
      shell: pwsh
      run: |
        $runtime = "publish/portable/Microsoft.WindowsAppRuntime.dll"
        if (-not (Test-Path $runtime)) {
            Write-Error "输出目录中未找到 Microsoft.WindowsAppRuntime.dll，自包含打包未生效"
            exit 1
        }
        if (-not (Test-Path "publish/portable/GalgameManager.exe")) {
            Write-Error "输出目录中未找到 GalgameManager.exe"
            exit 1
        }
        Write-Host "Windows App SDK 运行时已内置，便携包校验通过"

    # 动态版本号取构建期写入的资源文件（GalgameManager.csproj 的 GenerateBuildVersionInfo 目标），
    # 形如 1.10.3.7|1868|e9bc64d|ad402163：动态版本|提交总数|7位hash|未提交改动哈希。
    # 不读 Package.appxmanifest——那只是基础版本，同一基础版本下的每次构建都应能区分。
    # 必须在 publish 之后执行：该文件是构建产物。
    - name: Read dynamic version
      shell: pwsh
      run: |
        $file = Get-ChildItem -Path GalgameManager/obj -Recurse -Filter BuildVersionInfo.txt |
            # obj 下可能同时存在 Debug / Release 与各平台的产物，只取本次 Release 构建生成的
            Where-Object { $_.FullName -match '\\Release\\' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
        if (-not $file) { throw "未找到构建期生成的 BuildVersionInfo.txt" }
        $fields = (Get-Content $file.FullName).Trim() -split '\|'
        if ($fields.Count -lt 3) { throw "BuildVersionInfo.txt 格式异常: $($file.FullName)" }
        echo "VERSION=$($fields[0])" >> $env:GITHUB_ENV
        echo "COMMITS=$($fields[1])" >> $env:GITHUB_ENV
        echo "COMMIT=$($fields[2])" >> $env:GITHUB_ENV
        echo "动态版本: $($fields[0]) (提交 $($fields[1]) / $($fields[2]))"

    # GitHub 的 windows-latest 镜像自带 7-Zip，直接调用其 exe，不引入第三方 action
    - name: Compress (7z)
      shell: pwsh
      run: |
        $sevenZip = $null
        foreach ($c in @("C:\Program Files\7-Zip\7z.exe", "C:\Program Files (x86)\7-Zip\7z.exe")) {
            if (Test-Path $c) { $sevenZip = $c; break }
        }
        if (-not $sevenZip) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($cmd) { $sevenZip = $cmd.Source }
        }
        if (-not $sevenZip) { throw "未找到 7z.exe，无法打包" }
        Write-Host "使用 7z: $sevenZip"

        $folder = "PotatoVN-$env:VERSION-$env:PLATFORM-portable"
        Move-Item -Path publish/portable -Destination $folder
        $archive = "publish/$folder.7z"
        & $sevenZip a -t7z -mx=5 -bso0 -bsp0 $archive $folder
        if ($LASTEXITCODE -ne 0) { throw "7z 打包失败，退出码 $LASTEXITCODE" }
        if (-not (Test-Path $archive)) { throw "7z 打包后未找到 $archive" }
        echo "ARTIFACT=$folder.7z" >> $env:GITHUB_ENV
        Get-Item $archive | Select-Object Name, Length | Format-List

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PotatoVN-${{ env.PLATFORM }}-portable
        path: publish/${{ env.ARTIFACT }}
        if-no-files-found: error

    # 把便携包发成 GitHub Release，tag 取动态版本号（每次提交都不同，天然唯一）。
    # 用 windows-latest 自带的 gh CLI，不引入第三方 action（与上面 7z 的做法一致）。
    # PR 事件只有 contents: read 权限且不该产出版本，故跳过；workflow_dispatch 也发，
    # 方便手动补发。同一 commit 重跑时更新已有 Release 的资产与说明，不做删除，保证幂等。
    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # runner 的控制台代码页不一定是 UTF-8（本机是 CP936），git 输出的中文提交信息
        # 会按错误代码页解码成乱码，写进 Release Notes 前必须先纠正
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

        $tag = "v$env:VERSION"
        $archive = "publish/$env:ARTIFACT"
        $title = "PotatoVN $env:VERSION"

        # Release Notes：动态版本信息 + 自上一个 Release tag 以来的提交
        $prev = git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1
        if ($prev) {
            $log = git log --no-merges --pretty=format:"- %s (%h)" "$prev..HEAD"
        } else {
            $log = git log --no-merges --pretty=format:"- %s (%h)" -n 30
        }
        if ([string]::IsNullOrWhiteSpace($log)) { $log = "（自 $prev 以来没有新提交）" }
        $notes = @(
            "自包含便携包（$env:PLATFORM），解压即用，无需安装 .NET 与 Windows App Runtime。"
            ""
            "- 动态版本: $env:VERSION"
            "- 提交: $env:COMMIT（仓库累计 $env:COMMITS 个提交）"
            ""
            "## 自上次 Release 以来的变更"
            ""
            $log
        ) -join "`n"
        $notesFile = "publish/release-notes.md"
        Set-Content -Path $notesFile -Value $notes -Encoding utf8

        gh release view $tag 2>$null | Out-Null
        if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，更新资产与说明"
            gh release upload $tag $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传 Release 资产失败" }
            gh release edit $tag --title $title --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "更新 Release 说明失败" }
        } else {
            gh release create $tag $archive --title $title --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
        }
        Write-Host "Release 已发布: $tag ($archive)"
